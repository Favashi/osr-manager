name: Publish (Pages + Release)

# Publicación EXCLUSIVAMENTE MANUAL. Ningún commit/push/PR dispara este
# workflow — solo "Actions -> Publish (Pages + Release) -> Run workflow".
#
# Dos modos, un solo workflow:
#   publish_release = false -> solo actualiza GitHub Pages (landing + app).
#   publish_release = true  -> además crea tag vX.Y.Z, GitHub Release y
#                               adjunta osr-manager.zip (el ZIP portable).
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar release (crea tag + GitHub Release + osr-manager.zip, usando la versión del fichero VERSION)'
        type: boolean
        default: false
      release_notes:
        description: 'Notas de versión (opcional; si se deja vacío se usa un texto mínimo)'
        type: string
        default: ''

# La publicación es manual y no debe cancelarse silenciosamente si ya hay
# una ejecución en curso.
concurrency:
  group: publish
  cancel-in-progress: false

# Sin permisos por defecto a nivel de workflow: cada job declara
# ÚNICAMENTE lo que necesita (ver comentarios en cada uno).
permissions: {}

jobs:
  # ------------------------------------------------------------------
  # 1) Validar: sintaxis JS + (si hay release) coherencia de versión y
  #    que el tag no exista ya. Nada más avanza si esto falla.
  # ------------------------------------------------------------------
  validate:
    name: Validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # OSR Manager no necesita Node para ejecutarse. Se usa aquí únicamente
      # como comprobación de sintaxis previa al deploy (sin package.json, sin
      # build, sin dependencias) para no publicar JS roto.
      - name: Validar sintaxis JavaScript
        run: |
          set -e
          shopt -s globstar nullglob
          files=(js/**/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se encontraron ficheros JS en js/" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Leer VERSION (fuente única)
        id: version
        run: |
          set -e
          if [ ! -f VERSION ]; then
            echo "::error::Falta el fichero VERSION en la raíz del repositorio (fuente única de versión)."
            exit 1
          fi
          value="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$value" ]; then
            echo "::error::VERSION está vacío."
            exit 1
          fi
          echo "Versión declarada en VERSION: $value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # Solo se ejecuta si se va a publicar Release: sin esto, "Deploy Pages
      # only" no necesita que exista/coincida ninguna versión de entrada.
      - name: Validar versión y tag para Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -e
          if ! grep -qF "Versión: $REPO_VERSION" index.html; then
            echo "::error::index.html (ventana Acerca de) no muestra 'Versión: $REPO_VERSION'. Actualízalo antes de publicar — misma fuente, sin versiones contradictorias."
            exit 1
          fi
          tag="v$REPO_VERSION"
          if gh api "repos/${{ github.repository }}/git/refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::El tag $tag ya existe. No se sobrescribe una Release existente — sube la versión en VERSION si quieres publicar de nuevo."
            exit 1
          fi
          echo "Versión $REPO_VERSION lista para publicarse como $tag."

  # ------------------------------------------------------------------
  # 2) ZIP portable: SOLO si se publica Release. Allowlist explícita
  #    basada en lo que index.html realmente carga (ver <link>/<script>
  #    en el propio fichero) — nunca "copiar todo menos excluir".
  # ------------------------------------------------------------------
  build_zip:
    name: Construir osr-manager.zip
    needs: validate
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Construir allowlist portable
        run: |
          set -e
          mkdir -p _dist/osr-manager
          cp index.html _dist/osr-manager/
          cp -r css _dist/osr-manager/
          cp -r js _dist/osr-manager/
          cp LICENSE _dist/osr-manager/
          cp THIRD_PARTY_NOTICES.md _dist/osr-manager/
          cp VERSION _dist/osr-manager/

      - name: Verificar contenido del ZIP
        run: |
          set -e
          test -f _dist/osr-manager/index.html || { echo "::error::Falta index.html en el paquete portable." >&2; exit 1; }

          # Solo rutas relativas: si index.html referenciara /css o /js
          # (absolutas) dejaría de funcionar tanto en file:// como bajo
          # cualquier subcarpeta.
          if grep -qE 'href="/[^/]|src="/[^/]' _dist/osr-manager/index.html; then
            echo "::error::index.html contiene una ruta absoluta (/...). Debe ser relativa para funcionar con file://." >&2
            exit 1
          fi

          # La allowlist es la única fuente de contenido (no exclusiones
          # sobre una copia completa), así que no puede colarse nada fuera
          # de esta lista — lo comprobamos igualmente como cinturón y
          # tirantes.
          allowed_top='^osr-manager/(index\.html|LICENSE|THIRD_PARTY_NOTICES\.md|VERSION|css/|js/)'
          unexpected="$(find _dist -type f | sed 's#^_dist/##' | grep -Ev "$allowed_top" || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Ficheros fuera de la allowlist portable:"
            echo "$unexpected"
            exit 1
          fi

          echo "Contenido del paquete portable:"
          find _dist -type f | sed 's#^_dist/##' | sort

      - name: Empaquetar ZIP
        run: |
          set -e
          cd _dist
          zip -r ../osr-manager.zip osr-manager
          cd ..
          unzip -l osr-manager.zip

      - name: Subir ZIP como artifact temporal (uso interno del workflow)
        uses: actions/upload-artifact@v4
        with:
          name: osr-manager-zip
          path: osr-manager.zip
          retention-days: 1

  # ------------------------------------------------------------------
  # 3) GitHub Pages: landing + app. Se ejecuta siempre que "validate"
  #    haya pasado, tanto si hay Release en esta ejecución como si no.
  # ------------------------------------------------------------------
  pages:
    name: Publicar GitHub Pages
    needs: [validate, build_zip]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.build_zip.result == 'success' || needs.build_zip.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Necesario para saber si YA existe alguna Release publicada (de esta
      # ejecución o de una anterior): la landing solo muestra "Descargar
      # ZIP"/"Ver cambios" cuando hay algo real a lo que apuntar. Una única
      # comprobación en el momento de publicar, nunca en el navegador del
      # visitante.
      - name: Comprobar si existe alguna Release
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.publish_release }}" = "true" ] || gh release view --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      # Raíz del sitio = landing (site/index.html). /app/ = la aplicación
      # real (idéntica a abrir index.html en local). El index.html de la
      # raíz del repo NO se toca ni se publica en la raíz del sitio: sigue
      # siendo el punto de entrada portable (file://).
      - name: Construir _site
        env:
          OSR_VERSION: ${{ needs.validate.outputs.version }}
          HAS_RELEASE: ${{ steps.release_check.outputs.has_release }}
        run: |
          set -e
          mkdir -p _site/app
          cp site/index.html _site/index.html
          if [ -d site/screenshots ]; then cp -r site/screenshots _site/screenshots; fi

          # CSS real de la app para la landing (site/index.html enlaza
          # ./css/tui.css y ./css/custom.css): copia independiente de la
          # de _site/app/css de abajo, mismo origen, cero duplicación en
          # el repo (site/css es un symlink a ../css solo para que la
          # misma ruta funcione también al abrir site/index.html en
          # local, sin pasar por este workflow).
          cp -r css _site/css

          # Versión estática incrustada en la landing publicada (no en el
          # fuente del repo): sin build tool, un simple reemplazo de texto.
          sed -i "s/__OSR_VERSION__/${OSR_VERSION}/g" _site/index.html

          # Enlaces de descarga/cambios: ocultos por defecto en el fuente
          # (clase "release-only" con display:none). Si ya hay Release, se
          # quita SOLO el token " release-only" al final de cualquier
          # atributo class="..." (siempre el último, por convención en
          # site/index.html), preservando el resto de clases reales de la
          # app (tui-button, white-255...). El patrón exige la comilla de
          # cierre justo después, así que no puede coincidir con el
          # selector CSS ".release-only { display: none; }" del <style>
          # (ahí no hay comillas). El fuente en site/ queda intacto.
          if [ "$HAS_RELEASE" = "true" ]; then
            sed -i 's/ release-only"/"/g' _site/index.html
          fi

          cp index.html _site/app/index.html
          cp -r css _site/app/css
          cp -r js _site/app/js
          if [ -d data ]; then cp -r data _site/app/data; fi
          if [ -d fonts ]; then cp -r fonts _site/app/fonts; fi
          if [ -d assets ]; then cp -r assets _site/app/assets; fi
          touch _site/.nojekyll

      - name: Verificar artifact
        run: |
          set -e
          test -f _site/index.html || { echo "Falta _site/index.html (landing)" >&2; exit 1; }
          test -f _site/app/index.html || { echo "Falta _site/app/index.html" >&2; exit 1; }
          test -d _site/app/css || { echo "Falta _site/app/css" >&2; exit 1; }
          test -d _site/app/js || { echo "Falta _site/app/js" >&2; exit 1; }
          test -f _site/.nojekyll || { echo "Falta _site/.nojekyll" >&2; exit 1; }
          if grep -q '__OSR_VERSION__' _site/index.html; then
            echo "::error::El marcador __OSR_VERSION__ no se sustituyó en la landing." >&2
            exit 1
          fi
          echo "Artifact verificado:"
          find _site -maxdepth 3 | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------
  # 4) Release: SOLO si se publica Release. Tag + GitHub Release +
  #    osr-manager.zip como asset (nombre fijo, sin versión en el
  #    nombre: permite el enlace permanente releases/latest/download/).
  # ------------------------------------------------------------------
  release:
    name: Publicar Release
    needs: [validate, build_zip]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Descargar ZIP
        uses: actions/download-artifact@v4
        with:
          name: osr-manager-zip

      - name: Crear tag y GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -e
          tag="v$VERSION"
          notes="$NOTES"
          if [ -z "$notes" ]; then
            notes="OSR Manager v$VERSION. Ver CHANGELOG.md para el detalle completo."
          fi
          gh release create "$tag" osr-manager.zip \
            --repo "${{ github.repository }}" \
            --title "OSR Manager v$VERSION" \
            --notes "$notes" \
            --target "${{ github.sha }}"

      - name: Resumen
        run: |
          {
            echo "## OSR Manager v${{ needs.validate.outputs.version }} publicado"
            echo ""
            echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate.outputs.version }}"
            echo "- **ZIP:** https://github.com/${{ github.repository }}/releases/latest/download/osr-manager.zip"
          } >> "$GITHUB_STEP_SUMMARY"
