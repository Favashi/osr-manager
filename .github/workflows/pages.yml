name: Publish GitHub Pages

# Publicación EXCLUSIVAMENTE MANUAL. Ningún commit/push/PR dispara este
# workflow — solo "Actions -> Publish GitHub Pages -> Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# La publicación es manual y no debe cancelarse silenciosamente si ya hay
# una ejecución en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # OSR Manager no necesita Node para ejecutarse. Se usa aquí únicamente
      # como comprobación de sintaxis previa al deploy (sin package.json, sin
      # build, sin dependencias) para no publicar JS roto.
      - name: Validar sintaxis JavaScript
        run: |
          set -e
          shopt -s globstar nullglob
          files=(js/**/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se encontraron ficheros JS en js/" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done

      # Allowlist: se copia SOLO lo que el navegador necesita en runtime.
      # No se publica .github/, README, LICENSE, herramientas de desarrollo,
      # etc. (ver #12/#37 del pack de infraestructura).
      #
      # Raíz del sitio = landing (site/index.html, "página web" de la app).
      # /app/ = la aplicación real (idéntica a abrir index.html en local).
      # index.html de la raíz del repo NO se toca ni se publica en la raíz
      # del sitio: sigue siendo el punto de entrada portable (file://).
      - name: Construir _site (allowlist runtime)
        run: |
          set -e
          mkdir -p _site/app
          cp site/index.html _site/index.html

          cp index.html _site/app/index.html
          cp -r css _site/app/css
          cp -r js _site/app/js
          if [ -d data ]; then cp -r data _site/app/data; fi
          if [ -d fonts ]; then cp -r fonts _site/app/fonts; fi
          if [ -d assets ]; then cp -r assets _site/app/assets; fi
          touch _site/.nojekyll

      - name: Verificar artifact
        run: |
          set -e
          test -f _site/index.html || { echo "Falta _site/index.html (landing)" >&2; exit 1; }
          test -f _site/app/index.html || { echo "Falta _site/app/index.html" >&2; exit 1; }
          test -d _site/app/css || { echo "Falta _site/app/css" >&2; exit 1; }
          test -d _site/app/js || { echo "Falta _site/app/js" >&2; exit 1; }
          test -f _site/.nojekyll || { echo "Falta _site/.nojekyll" >&2; exit 1; }
          echo "Artifact verificado:"
          find _site -maxdepth 3 | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resumen del deploy
        run: |
          {
            echo "## OSR Manager publicado correctamente"
            echo ""
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Landing:** ${{ steps.deployment.outputs.page_url }}"
            echo "- **App:** ${{ steps.deployment.outputs.page_url }}app/"
          } >> "$GITHUB_STEP_SUMMARY"
